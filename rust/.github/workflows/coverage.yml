name: ☂ Code Coverage

on:
  push:
    branches: [ main ]

  pull_request:
    branches: [ '**' ]

concurrency:
  group: {{ "${{ github.workflow " }}}}-{{ "${{ github.ref " }}}}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:{% if axum %}
      - name: Install Protoc
        uses: arduino/setup-protoc@v1
        with:
          repo-token: {{ "${{ secrets.GITHUB_TOKEN " }}}}{% endif %}
      - name: Checkout Repository
        uses: actions/checkout@v4

      # even though we use nightly below, there are a few cases where we call
      # cargo against stable, and we want a recent cargo to support rust2024
      - name: Install Stable Cargo Toolchain (ensure we can support rust2024)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: cargo

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustc, rust-std, cargo, llvm-tools, llvm-tools-preview
          toolchain: 'nightly'

      - name: Cache Project
        uses: Swatinem/rust-cache@v2

      - name: Generate Code coverage
        env:
          CARGO_INCREMENTAL: '0'
          LLVM_PROFILE_FILE: "{{project-name}}-%p-%m.profraw"
          RUSTFLAGS: '-Zprofile -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code -Coverflow-checks=off'
          RUSTDOCFLAGS: '-Zprofile -Ccodegen-units=1 -Cinline-threshold=0 -Clink-dead-code -Coverflow-checks=off'
        run: cargo test --all-features

      - name: Install grcov
        run: "curl -L https://github.com/mozilla/grcov/releases/download/v0.8.12/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf -"

      - name: Run grcov
        run: "./grcov . --llvm --binary-path target/debug/ -s . -t lcov --branch --ignore-not-existing --ignore '/*' -o lcov.info"

      - name: Install covfix
        uses: actions-rs/install@v0.1
        with:
          crate: rust-covfix
          use-tool-cache: true

      - name: Run covfix
        run: rust-covfix lcov.info -o lcov.info --verbose

      - name: Upload to codecov.io
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          token: {{ "${{ secrets.CODECOV_TOKEN " }}}}
          fail_ci_if_error: false
          files: lcov.info
